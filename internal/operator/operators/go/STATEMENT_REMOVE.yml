id: STATEMENT_REMOVE/assign
language: go
rule:
  kind: assignment_statement
  pattern: $X = $E
fix: _ = $E
---
id: STATEMENT_REMOVE/call
language: go
rule:
  kind: expression_statement
  has:
    kind: call_expression
    not:
      has:
        field: function
        regex: ^panic$|\.\s*(Msgf?|Send)$
fix: ''
