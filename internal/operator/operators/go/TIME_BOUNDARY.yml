id: TIME_BOUNDARY/after
language: go
rule:
  pattern:
    context: 'func f() { _ = $A.After($B) }'
    selector: call_expression
  not:
    inside:
      kind: unary_expression
      regex: ^!
fix: '!$A.Before($B)'
---
id: TIME_BOUNDARY/before
language: go
rule:
  pattern:
    context: 'func f() { _ = $A.Before($B) }'
    selector: call_expression
  not:
    inside:
      kind: unary_expression
      regex: ^!
fix: '!$A.After($B)'
---
id: TIME_BOUNDARY/not-after
language: go
rule:
  kind: unary_expression
  regex: ^!
  has:
    field: operand
    pattern:
      context: 'func f() { _ = $A.After($B) }'
      selector: call_expression
fix: $A.Before($B)
---
id: TIME_BOUNDARY/not-before
language: go
rule:
  kind: unary_expression
  regex: ^!
  has:
    field: operand
    pattern:
      context: 'func f() { _ = $A.Before($B) }'
      selector: call_expression
fix: $A.After($B)
