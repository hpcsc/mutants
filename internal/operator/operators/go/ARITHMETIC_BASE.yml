id: ARITHMETIC_BASE/plus
language: go
rule:
  pattern: $A + $B
fix: $A - $B
---
id: ARITHMETIC_BASE/minus
language: go
rule:
  pattern: $A - $B
fix: $A + $B
---
id: ARITHMETIC_BASE/multiply
language: go
rule:
  pattern: $A * $B
fix: $A / $B
---
id: ARITHMETIC_BASE/divide
language: go
rule:
  pattern: $A / $B
fix: $A * $B
---
id: ARITHMETIC_BASE/remainder
language: go
rule:
  pattern: $A % $B
fix: $A * $B
