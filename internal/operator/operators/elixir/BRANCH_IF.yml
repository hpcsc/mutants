id: BRANCH_IF/keyword
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
rule:
  all:
    - inside:
        kind: call
        has:
          field: target
          regex: ^(def|defp)$
        stopBy: end
  matches: expression
  inside:
    kind: pair
    field: value
    has:
      field: key
      regex: '^do:'
    inside:
      kind: keywords
      inside:
        kind: arguments
        inside:
          kind: call
          has:
            field: target
            regex: ^(if|unless)$
fix: nil
