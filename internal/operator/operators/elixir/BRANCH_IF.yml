id: BRANCH_IF/if
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
rule:
  all:
    - inside:
        kind: call
        has:
          field: target
          regex: ^(def|defp)$
        stopBy: end
  pattern: if $COND do $$$EDIT end
  has:
    kind: do_block
    has:
      matches: expression
    not:
      has:
        kind: else_block
fix: nil
---
