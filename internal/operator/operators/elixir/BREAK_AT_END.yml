id: BREAK_AT_END/for
language: elixir
utils:
  function:
    kind: call
    has:
      field: target
      regex: ^(def|defp)$
rule:
  kind: binary_operator
  pattern: $P <- $E
  all:
    - inside:
        matches: function
        stopBy: end
  inside:
    kind: arguments
    inside:
      kind: call
      has:
        field: target
        regex: ^for$
fix: $P <- Enum.take($E, 1)
---
id: BREAK_AT_END/enum
language: elixir
utils:
  function:
    kind: call
    has:
      field: target
      regex: ^(def|defp)$
  loop:
    kind: call
    has:
      field: target
      regex: ^Enum\.(each|map|flat_map|filter|reject|reduce|reduce_while|map_reduce)$
  pipe:
    kind: binary_operator
    has:
      field: operator
      regex: ^\|>$
rule:
  pattern: Enum.$F($E, $$$REST)
  matches: loop
  all:
    - inside:
        matches: function
        stopBy: end
  not:
    inside:
      matches: pipe
      field: right
fix: Enum.$F(Enum.take($E, 1), $$$REST)
---
id: BREAK_AT_END/pipe
language: elixir
utils:
  function:
    kind: call
    has:
      field: target
      regex: ^(def|defp)$
  loop:
    kind: call
    has:
      field: target
      regex: ^Enum\.(each|map|flat_map|filter|reject|reduce|reduce_while|map_reduce)$
  pipe:
    kind: binary_operator
    has:
      field: operator
      regex: ^\|>$
rule:
  pattern: $CALL
  matches: loop
  all:
    - inside:
        matches: function
        stopBy: end
  inside:
    matches: pipe
    field: right
fix: Enum.take(1) |> $CALL
