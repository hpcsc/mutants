id: STATEMENT_REMOVE/assign
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
  function:
    kind: call
    has:
      field: target
      regex: ^(def|defp)$
  last:
    nthChild:
      position: 1
      reverse: true
      ofRule:
        matches: expression
  statement:
    all:
      - inside:
          any:
            - kind: do_block
            - kind: else_block
            - kind: body
      - not:
          matches: last
      - inside:
          matches: function
          stopBy: end
      - not:
          inside:
            kind: call
            has:
              field: target
              regex: ^quote$
            stopBy: end
rule:
  pattern: $X = $E
  has:
    field: left
    kind: identifier
    regex: ^[^_]
  matches: statement
fix: _ = $E
---
id: STATEMENT_REMOVE/call
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
  function:
    kind: call
    has:
      field: target
      regex: ^(def|defp)$
  last:
    nthChild:
      position: 1
      reverse: true
      ofRule:
        matches: expression
  pipe:
    kind: binary_operator
    has:
      field: operator
      regex: ^\|>$
  statement:
    all:
      - inside:
          any:
            - kind: do_block
            - kind: else_block
            - kind: body
      - not:
          matches: last
      - inside:
          matches: function
          stopBy: end
      - not:
          inside:
            kind: call
            has:
              field: target
              regex: ^quote$
            stopBy: end
rule:
  any:
    - kind: call
      not:
        any:
          - has:
              kind: do_block
          - has:
              field: target
              regex: ^(if|unless|case|cond|with|for|try|receive|quote|unquote|raise|reraise|throw|exit|import|alias|require|use|super)$
    - matches: pipe
  matches: statement
fix: nil
