id: CONDITION_TRUE/if
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
rule:
  all:
    - inside:
        kind: call
        has:
          field: target
          regex: ^(def|defp)$
        stopBy: end
  pattern: if $EDIT do $$$BODY end
  has:
    kind: do_block
    has:
      matches: expression
    not:
      has:
        kind: else_block
fix: 'true'
---
id: CONDITION_TRUE/keyword
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
rule:
  all:
    - inside:
        kind: call
        has:
          field: target
          regex: ^(def|defp)$
        stopBy: end
  matches: expression
  nthChild: 1
  inside:
    kind: arguments
    inside:
      kind: call
      has:
        field: target
        regex: ^if$
    has:
      kind: keywords
      has:
        kind: pair
        has:
          field: key
          regex: '^do:'
      not:
        has:
          kind: pair
          has:
            field: key
            regex: '^else:'
fix: 'true'
