id: NAMED_VALUE_REMOVE
language: elixir
utils:
  block-key:
    kind: pair
    has:
      field: key
      regex: '^(do|else|after|rescue|catch):'
  definition:
    kind: call
    has:
      field: target
      regex: ^(def|defp|defmacro|defmacrop)$
  guard:
    kind: binary_operator
    has:
      field: operator
      regex: ^when$
  head:
    kind: call
    any:
      - inside:
          kind: arguments
          inside:
            matches: definition
      - inside:
          matches: guard
          field: left
          inside:
            kind: arguments
            inside:
              matches: definition
  pattern:
    all:
      - any:
          - inside:
              kind: arguments
              inside:
                matches: head
              stopBy: end
          - inside:
              kind: stab_clause
              field: left
              stopBy: end
          - inside:
              kind: binary_operator
              field: left
              has:
                field: operator
                regex: ^(=|<-)$
              stopBy: end
          - inside:
              kind: binary_operator
              field: right
              has:
                field: operator
                regex: ^::$
              stopBy: end
      - not:
          inside:
            matches: guard
            field: right
            stopBy: end
  pattern-binding:
    all:
      - matches: pattern
      - has:
          field: value
          any:
            - kind: identifier
              regex: ^[^_]
            - has:
                kind: identifier
                regex: ^[^_]
                not:
                  inside:
                    kind: unary_operator
                    has:
                      field: operator
                      regex: ^[\^@]$
                stopBy: end
rule:
  kind: pair
  not:
    any:
      - matches: block-key
      - matches: pattern-binding
  precedes:
    kind: pair
    stopBy: end
fix:
  template: ''
  expandEnd:
    regex: ','
