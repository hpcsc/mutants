id: BRANCH_CASE
language: elixir
utils:
  expression:
    any:
      - kind: block
      - kind: identifier
      - kind: alias
      - kind: integer
      - kind: float
      - kind: char
      - kind: boolean
      - kind: nil
      - kind: atom
      - kind: quoted_atom
      - kind: string
      - kind: charlist
      - kind: sigil
      - kind: list
      - kind: tuple
      - kind: bitstring
      - kind: map
      - kind: unary_operator
      - kind: binary_operator
      - kind: dot
      - kind: call
      - kind: access_call
      - kind: anonymous_function
rule:
  all:
    - inside:
        kind: call
        has:
          field: target
          regex: ^(def|defp)$
        stopBy: end
  kind: body
  has:
    matches: expression
  inside:
    kind: stab_clause
    inside:
      any:
        - kind: do_block
          inside:
            kind: call
            has:
              field: target
              regex: ^(case|cond|receive)$
        - kind: else_block
          inside:
            kind: do_block
            inside:
              kind: call
              has:
                field: target
                regex: ^with$
fix: nil
