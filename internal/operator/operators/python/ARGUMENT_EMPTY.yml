id: ARGUMENT_EMPTY/positional
language: python
rule:
  any:
    - kind: attribute
    - kind: await
    - kind: binary_operator
    - kind: boolean_operator
    - kind: call
    - kind: comparison_operator
    - kind: concatenated_string
    - kind: conditional_expression
    - kind: dictionary
    - kind: dictionary_comprehension
    - kind: float
    - kind: generator_expression
    - kind: identifier
    - kind: integer
    - kind: lambda
    - kind: list
    - kind: list_comprehension
    - kind: named_expression
    - kind: not_operator
    - kind: parenthesized_expression
    - kind: set
    - kind: set_comprehension
    - kind: string
    - kind: subscript
    - kind: 'true'
    - kind: 'false'
    - kind: tuple
    - kind: unary_operator
  inside:
    kind: argument_list
fix: None
---
id: ARGUMENT_EMPTY/keyword
language: python
rule:
  any:
    - kind: attribute
    - kind: await
    - kind: binary_operator
    - kind: boolean_operator
    - kind: call
    - kind: comparison_operator
    - kind: concatenated_string
    - kind: conditional_expression
    - kind: dictionary
    - kind: dictionary_comprehension
    - kind: float
    - kind: generator_expression
    - kind: identifier
    - kind: integer
    - kind: lambda
    - kind: list
    - kind: list_comprehension
    - kind: named_expression
    - kind: not_operator
    - kind: parenthesized_expression
    - kind: set
    - kind: set_comprehension
    - kind: string
    - kind: subscript
    - kind: 'true'
    - kind: 'false'
    - kind: tuple
    - kind: unary_operator
  inside:
    kind: keyword_argument
    field: value
fix: None
